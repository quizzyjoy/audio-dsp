name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No HarmonyOS SDK on hosted runners: validate manifest/docs/native layout instead.
      - run: node scripts/check-release.mjs
